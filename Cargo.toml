[package]
name = "mandelbrot"
version = "0.1.0"
edition = "2021"
description = "A server for generating and hosting mandelbrot set tiles"
authors = ["AdriDoesThings <adrian@adrn.dev>", "PhilippIRL <pplussinfo@gmail.com>"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = { version = "0", features = ["tokio"] }
futures = "0"
image = { version = "0", features = ["png"], default-features = false }
indicatif = { version = "0", optional = true }
r2d2 = "0"
redis = { version = "1", features = ["r2d2"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0", features = ["io"] }

[features]
pregenerate_progressbar = ["dep:indicatif"]

[profile.release]
lto = true
opt-level = 3
